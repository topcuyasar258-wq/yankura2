<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Yankura — Gerçek Analiz</title>
    <style>
        :root { --gold: #c9a84c; --charcoal: #1c1c1e; }
        body { background: var(--charcoal); color: white; font-family: sans-serif; display: flex; justify-content: center; padding-top: 50px; }
        .card { background: #2a2a2d; padding: 30px; border-radius: 15px; border: 1px solid var(--gold); width: 350px; text-align: center; }
        input { width: 80%; padding: 10px; margin-bottom: 10px; background: #333; border: 1px solid var(--gold); color: white; }
        button { width: 87%; padding: 10px; background: var(--gold); border: none; cursor: pointer; font-weight: bold; }
        #loading { display: none; margin: 15px 0; color: var(--gold); font-style: italic; }
        #error { display: none; color: #ff6b6b; margin-top: 15px; font-size: 14px; }
        #results { display: none; margin-top: 20px; border-top: 1px solid #444; padding-top: 15px; }
        .stat { display: flex; justify-content: space-between; margin: 8px 0; }
        .val { color: var(--gold); font-weight: bold; }
    </style>
</head>
<body>

<div class="card">
    <h2 style="color: var(--gold)">INSTAGRAM ANALİZ</h2>
    <input type="text" id="username" placeholder="Kullanıcı adı yaz...">
    <button onclick="analizEt()">ANALİZİ BAŞLAT</button>
    
    <div id="loading">Sistem taranıyor, lütfen bekle...</div>
    <div id="error">Hata: Kullanıcı bulunamadı veya hesap gizli!</div>

    <div id="results">
        <div class="stat"><span>Takipçi:</span> <span id="followers" class="val">-</span></div>
        <div class="stat"><span>Takip Edilen:</span> <span id="following" class="val">-</span></div>
        <div class="stat"><span>Gönderi:</span> <span id="posts" class="val">-</span></div>
        <div class="stat"><span>Gizli mi?</span> <span id="isPrivate" class="val">-</span></div>
    </div>
</div>

<script>
async function analizEt() {
    const user = document.getElementById('username').value.trim();
    const loading = document.getElementById('loading');
    const error = document.getElementById('error');
    const results = document.getElementById('results');

    if(!user) return alert("İsim yazmadın kanka!");

    // Ekranı temizle
    loading.style.display = 'block';
    error.style.display = 'none';
    results.style.display = 'none';

    // BU KISIM API İLE KONUŞUR
    const url = `https://instagram-scraper-api2.p.rapidapi.com/v1/info?username_or_id=${user}`;
    const options = {
        method: 'GET',
        headers: {
            'x-rapidapi-key': '4aa5e08428msh9fa81ac08860f25p113396jsn81cd13018273', // Senin keyin
            'x-rapidapi-host': 'instagram-scraper-api2.p.rapidapi.com'
        }
    };

    try {
        const response = await fetch(url, options);
        const result = await response.json();

        // Eğer Instagram "Böyle bir kullanıcı yok" derse burası çalışır
        if (!result.data || result.detail === "User not found") {
            throw new Error("Bulunamadı");
        }

        // Verileri ekrana yazdırıyoruz
        document.getElementById('followers').innerText = result.data.follower_count.toLocaleString();
        document.getElementById('following').innerText = result.data.following_count.toLocaleString();
        document.getElementById('posts').innerText = result.data.media_count;
        document.getElementById('isPrivate').innerText = result.data.is_private ? "Evet (Analiz Kısıtlı)" : "Hayır";

        loading.style.display = 'none';
        results.style.display = 'block';

    } catch (err) {
        console.error(err);
        loading.style.display = 'none';
        error.style.display = 'block'; // YANLIŞ HESAP GİRİLDİĞİNDE BURASI ÇALIŞIR
    }
}
</script>

</body>
</html>
