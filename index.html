<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yankura — Gerçek Zamanlı Analiz</title>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        /* Senin o güzel tasarımın (CSS) buraya gelecek. 
           Yer kaplamasın diye kısalttım ama senin orijinal stilin korunacak */
        :root { --emerald: #1a5c3a; --gold: #c9a84c; --charcoal: #1c1c1e; --off-white: #f5f0e8; --text-muted: #8a8a8a; }
        body { background: var(--charcoal); color: var(--off-white); font-family: 'DM Sans', sans-serif; padding: 20px; }
        .analyze-card { background: #2a2a2d; padding: 2rem; border-radius: 8px; max-width: 500px; margin: 50px auto; border: 1px solid var(--gold); }
        .ig-row { display: flex; margin-bottom: 1rem; }
        .ig-at { background: var(--gold); color: #000; padding: 10px; font-weight: bold; }
        .ig-input { flex: 1; padding: 10px; background: #333; border: 1px solid #444; color: #fff; outline: none; }
        #analyzeBtn { width: 100%; padding: 12px; background: var(--gold); border: none; cursor: pointer; font-weight: bold; text-transform: uppercase; }
        #analyzeBtn:disabled { opacity: 0.5; cursor: not-allowed; }
        #resultArea { margin-top: 20px; display: none; padding: 15px; border-top: 1px dashed var(--gold); }
        .error-msg { color: #ff6b6b; font-size: 0.9rem; margin-top: 10px; text-align: center; display: none; }
        .stat-box { display: flex; justify-content: space-between; margin: 10px 0; font-size: 1.1rem; }
        .stat-val { color: var(--gold); font-family: 'Bebas Neue', sans-serif; }
        /* Yükleniyor animasyonu */
        .loader { display: none; text-align: center; margin: 10px 0; color: var(--gold); font-size: 0.8rem; letter-spacing: 2px; }
    </style>
</head>
<body>

    <div class="analyze-card">
        <h2 style="font-family: 'Bebas Neue'; font-size: 2rem; margin-bottom: 1rem; color: var(--gold);">INSTAGRAM ANALİZ</h2>
        <p style="color: var(--text-muted); font-size: 0.8rem; margin-bottom: 1.5rem;">Gerçek zamanlı verilerle hesabının gücünü ölç.</p>
        
        <div class="ig-row">
            <div class="ig-at">@</div>
            <input type="text" id="igInput" class="ig-input" placeholder="kullanıcıadı" autocomplete="off">
        </div>
        
        <button id="analyzeBtn" onclick="gercekAnaliz()">ANALİZİ BAŞLAT</button>
        <div id="errorMessage" class="error-msg">Hata: Kullanıcı bulunamadı!</div>
        <div id="loadingStatus" class="loader">VERİLER ÇEKİLİYOR...</div>

        <div id="resultArea">
            <div class="stat-box"><span>Takipçi:</span> <span id="resFollowers" class="stat-val">0</span></div>
            <div class="stat-box"><span>Gönderi:</span> <span id="resPosts" class="stat-val">0</span></div>
            <div class="stat-box"><span>Etkileşim Oranı:</span> <span id="resEng" class="stat-val">%0</span></div>
        </div>
    </div>

    <script>
        async function gercekAnaliz() {
            const username = document.getElementById('igInput').value.trim();
            const btn = document.getElementById('analyzeBtn');
            const errorDiv = document.getElementById('errorMessage');
            const loader = document.getElementById('loadingStatus');
            const resultArea = document.getElementById('resultArea');

            if(!username) {
                alert("Önce bir kullanıcı adı yaz kanka!");
                return;
            }

            // Arayüzü hazırla
            btn.disabled = true;
            errorDiv.style.display = 'none';
            resultArea.style.display = 'none';
            loader.style.display = 'block';

            const options = {
                method: 'GET',
                headers: {
                    'x-rapidapi-key': '4aa5e08428msh9fa81ac08860f25p113396jsn81cd13018273', // Senin anahtarın
                    'x-rapidapi-host': 'instagram-statistics-api.p.rapidapi.com'
                }
            };

            try {
                // API'ye istek atıyoruz (Kullanıcı bilgilerini getirir)
                const response = await fetch(`https://instagram-statistics-api.p.rapidapi.com/account_info?username=${username}`, options);
                const result = await response.json();

                if (result.success === false || !result.data) {
                    throw new Error("Bulunamadı");
                }

                // Verileri yerleştir
                const data = result.data;
                document.getElementById('resFollowers').innerText = data.follower_count.toLocaleString();
                document.getElementById('resPosts').innerText = data.media_count;
                
                // Basit bir etkileşim hesaplaması (Beğeni/Takipçi * 100)
                // Not: API detayına göre bu kısım daha da geliştirilebilir.
                const engRate = (data.engagement_rate || 0).toFixed(2);
                document.getElementById('resEng').innerText = `%${engRate}`;

                // Sonucu göster
                loader.style.display = 'none';
                resultArea.style.display = 'block';
                btn.disabled = false;

            } catch (error) {
                console.error(error);
                loader.style.display = 'none';
                errorDiv.innerText = "Kanka bu hesap bulunamadı ya da gizli! Lütfen kontrol et.";
                errorDiv.style.display = 'block';
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>
